services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticket-dashboard-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - NODE_ENV=production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:3000/api/v1
    container_name: ticket-dashboard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
